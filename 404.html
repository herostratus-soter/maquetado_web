<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada — Mocárabe Diseño Editorial</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#1a1a1a">

    <link rel="icon" type="image/x-icon" href="img/logo_solo.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="style.css">

    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background-color: #0a0a0a;
            color: #ffffff;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-title {
            font-size: 1.8rem;
            margin: 10px 0 20px;
        }
        .error-text {
            max-width: 500px;
            color: #a1a1aa;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 28px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-home:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="error-container">
        <a href="/">
            <img src="img/logo_header_black.svg" alt="Mocárabe Logo" style="height: 50px; margin-bottom: 30px; filter: invert(1);">
        </a>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Página no encontrada</h2>
        <p class="error-text">La página que buscas no existe o ha sido movida. Te invitamos a regresar al inicio para conocer nuestros servicios de maquetación y diseño editorial.</p>
        <a href="/" class="btn-home">Volver al Inicio</a>
    </div>
</body>

</html>
